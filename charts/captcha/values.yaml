replicaCount: 1

image:
  repository: ghcr.io/shlande/captcha
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  grpc:
    port: 9001
    targetPort: 9001
  http:
    port: 8080
    targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

startupProbe:
  enabled: true
  httpGet:
    path: /live
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  enabled: true
  httpGet:
    path: /live
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: 9001
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity: {}

config:
  server:
    host: "0.0.0.0"
    port: 9001
  providers:
    cloudflare:
      enabled: true
      secret_key: ""
      timeout: 10s

secret:
  cloudflareSecretKey: ""

extraEnv: []
# Example:
# - name: DEBUG
#   value: "true"
# - name: LOG_LEVEL
#   value: "debug"

extraVolumes: []
# Example:
# - name: custom-config
#   configMap:
#     name: custom-config

extraVolumeMounts: []
# Example:
# - name: custom-config
#   mountPath: /app/custom
