name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate version
        id: version
        run: |
          if [[ ${{ github.ref }} == 'refs/tags/v*.*.*' ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            SHA_SHORT=${GITHUB_SHA:0:7}
            VERSION="0.0.0-$SHA_SHORT"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-${matrix.arch}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    name: Create Docker Manifest
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Create manifest list
        run: |
          docker manifest create ${{ steps.meta.outputs.tags }} \
            ${{ steps.meta.outputs.tags }}-amd64 \
            ${{ steps.meta.outputs.tags }}-arm64

      - name: Push manifest
        run: |
          docker manifest push ${{ steps.meta.outputs.tags }}

  helm-publish:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [version, manifest]
    if: needs.version.outputs.is_tag == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git user
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Package Helm chart
        run: |
          helm package charts/captcha --version ${{ needs.version.outputs.version }} --app-version ${{ needs.version.outputs.version }}

      - name: Publish Helm chart to GHCR
        run: |
          helm push captcha-${{ needs.version.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ github.repository }}/helm

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [version, helm-publish]
    if: needs.version.outputs.is_tag == 'true' && github.event_name == 'push' && github.ref == 'refs/tags/v*.*.*'
    environment:
      name: production
      url: ${{ vars.KUBE_NAMESPACE != '' && 'https://' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Helm chart
        run: |
          helm package charts/captcha --version ${{ needs.version.outputs.version }} --app-version ${{ needs.version.outputs.version }}

      - name: Deploy to Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'captcha' }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > kubeconfig
          kubectl --kubeconfig=kubeconfig config set-cluster kubernetes --server=${{ vars.KUBE_SERVER || 'https://kubernetes.docker.internal:6443' }}

          if helm --kubeconfig=kubeconfig list -n $NAMESPACE | grep -q captcha; then
            helm --kubeconfig=kubeconfig upgrade captcha ./captcha-${{ needs.version.outputs.version }}.tgz \
              --namespace $NAMESPACE \
              --set image.tag=${{ needs.version.outputs.version }} \
              --wait --timeout 5m
          else
            helm --kubeconfig=kubeconfig install captcha ./captcha-${{ needs.version.outputs.version }}.tgz \
              --namespace $NAMESPACE \
              --set image.tag=${{ needs.version.outputs.version }} \
              --wait --timeout 5m
          fi

      - name: Verify deployment
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'captcha' }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > kubeconfig
          kubectl --kubeconfig=kubeconfig rollout status deployment/captcha -n $NAMESPACE
